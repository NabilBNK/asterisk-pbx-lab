[general]
static=yes
writeprotect=no

[internal]
include => parkedcalls

; Extension 1006 - omar
exten => 1006,1,NoOp(Calling omar)
 same => n,Set(FORWARD=${DB(CF/1006)})
 same => n,GotoIf($["${FORWARD}" != ""]?forward:dial)
 same => n(dial),Dial(PJSIP/1006,15,tT)
 same => n,VoiceMail(1006@main)
 same => n,Hangup()
 same => n(forward),NoOp(Call forwarded to ${FORWARD})
 same => n,Dial(PJSIP/${FORWARD},15,tT)
 same => n,VoiceMail(1006@main)
 same => n,Hangup()

