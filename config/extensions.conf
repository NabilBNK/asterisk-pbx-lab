; Voicemail access - dial *97
exten => *97,1,NoOp(Voicemail Access)
 same => n,VoiceMailMain(${CALLERID(num)}@main)
 same => n,Hangup()

; Echo test - dial 600
exten => 600,1,NoOp(Echo Test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Conference room - dial 700
exten => 700,1,NoOp(Conference Room)
 same => n,Answer()
 same => n,ConfBridge(conference1)
 same => n,Hangup()

; Queue access
exten => 800,1,NoOp(Support Queue)
 same => n,Answer()
 same => n,Queue(support_queue)
 same => n,Hangup()

exten => 801,1,NoOp(Sales Queue)
 same => n,Answer()
 same => n,Queue(sales_queue)
 same => n,Hangup()

; Linear Queue - dial 802
exten => 802,1,NoOp(Linear Queue - Priority Order)
 same => n,Answer()
 same => n,Queue(linear_queue)
 same => n,Hangup()

; Random Queue - dial 803
exten => 803,1,NoOp(Random Queue - Random Selection)
 same => n,Answer()
 same => n,Queue(random_queue)
 same => n,Hangup()

; Call Forward Activation - dial *72 + destination number
exten => _*72.,1,NoOp(Call Forward Activate to ${EXTEN:3})
 same => n,Set(DB(CF/${CALLERID(num)})=${EXTEN:3})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(call-fwd-on)
 same => n,Hangup()

; Call Forward Deactivation - dial *73
exten => *73,1,NoOp(Call Forward Deactivate)
 same => n,Set(temp=${DB_DELETE(CF/${CALLERID(num)})})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(call-fwd-off)
 same => n,Hangup()

; Call parking
[parkedcalls]
exten => 701,1,Park()
exten => 702,1,Park()
exten => 703,1,Park()
