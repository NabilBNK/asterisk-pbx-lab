[general]
static=yes
writeprotect=no

[internal]
; Extension 1001 - Laptop
exten => 1001,1,NoOp(Calling User 1001 - Laptop)
 same => n,Set(FORWARD=${DB(CF/1001)})
 same => n,GotoIf($["${FORWARD}" != ""]?forward:dial)
 same => n(dial),Dial(PJSIP/1001,15)
 same => n,VoiceMail(1001@main,b)
 same => n,Hangup()
 same => n(forward),NoOp(Forwarding to ${FORWARD})
 same => n,Dial(PJSIP/${FORWARD},30)
 same => n,VoiceMail(1001@main,b)
 same => n,Hangup()

