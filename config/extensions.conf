; Call Forward - dial *72 followed by extension (e.g., *721005)
exten => _*72.,1,NoOp(Call Forward Activate to ${EXTEN:3})
 same => n,Set(DB(CF/${CALLERID(num)})=${EXTEN:3})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(call-fwd-on)
 same => n,Hangup()

; Call Forward Cancel - dial *73
exten => *73,1,NoOp(Call Forward Deactivate)
 same => n,Set(RESULT=${DB_DELETE(CF/${CALLERID(num)})} )
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(call-fwd-off)
 same => n,Hangup()

; Voicemail access - dial *97
exten => *97,1,NoOp(Voicemail Access)
 same => n,VoiceMailMain(${CALLERID(num)}@main)
 same => n,Hangup()

; Echo test - dial 600
exten => 600,1,NoOp(Echo Test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Conference room - dial 700
exten => 700,1,NoOp(Conference Room)
 same => n,Answer()
 same => n,ConfBridge(conference1)
 same => n,Hangup()

; Queue access
exten => 800,1,NoOp(Support Queue)
 same => n,Answer()
 same => n,Queue(support_queue)
 same => n,Hangup()

exten => 801,1,NoOp(Sales Queue)
 same => n,Answer()
 same => n,Queue(sales_queue)
 same => n,Hangup()

exten => 802,1,NoOp(Linear Queue)
 same => n,Answer()
 same => n,Queue(linear_queue)
 same => n,Hangup()

exten => 803,1,NoOp(Random Queue)
 same => n,Answer()
 same => n,Queue(random_queue)
 same => n,Hangup()

; Call parking
[parkedcalls]
; Parking spaces are automatically managed by res_parking
; Users dial 770 to park, then dial 701-710 to retrieve
