[general]
persistentmembers = yes
monitor-type = MixMonitor

[support_queue]
strategy = ringall
timeout = 15
retry = 5
maxlen = 0
ringinuse = no  
announce-frequency = 30
announce-holdtime = yes
announce-position = yes
musicclass = default
member => PJSIP/1001
member => PJSIP/1002
member => PJSIP/1003
member => PJSIP/1004
member => PJSIP/1005
member => PJSIP/1006

[sales_queue]
strategy = rrmemory
timeout = 20
retry = 5
maxlen = 10
ringinuse = no  
announce-frequency = 45
announce-holdtime = yes
musicclass = default
member => PJSIP/1001
member => PJSIP/1002
member => PJSIP/1003
member => PJSIP/1004
member => PJSIP/1005
member => PJSIP/1006

[linear_queue]
strategy = linear
timeout = 15
retry = 5
maxlen = 0
ringinuse = no
announce-frequency = 30
announce-holdtime = yes
musicclass = default
member => PJSIP/1001    ; Priority 1 (always first)
member => PJSIP/1002    ; Priority 2 (backup)
member => PJSIP/1003    ; Priority 3 (last resort)
member => PJSIP/1004
member => PJSIP/1005
member => PJSIP/1006

[random_queue]
strategy = random
timeout = 15
retry = 5
maxlen = 0
ringinuse = no
announce-frequency = 30
announce-holdtime = yes
musicclass = default
member => PJSIP/1001
member => PJSIP/1002
member => PJSIP/1003
member => PJSIP/1004
member => PJSIP/1005
member => PJSIP/1006



